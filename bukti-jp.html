<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bukti Kemenangan - HOKBENTOTO</title>
<style>
  :root{ --gold:#f5c542; --gold-dk:#b8891f; --line:rgba(245,197,66,.3); }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{min-height:100vh;color:#fff;padding:26px 18px;display:flex;justify-content:center;
    background:linear-gradient(160deg,#0c0b0e,#050405);}
  .app{width:100%;max-width:1360px;display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start;}
  @media(max-width:1040px){.app{grid-template-columns:1fr;}}

  .control{position:sticky;top:26px;background:linear-gradient(180deg,#17140d,#0c0a07);
    border:1px solid var(--line);border-radius:20px;padding:22px;
    box-shadow:0 16px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(245,197,66,.12);}
  .ctitle{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:17px;font-weight:800;}
  .ctitle .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(180deg,#ffe9a8,#b8891f);
    display:flex;align-items:center;justify-content:center;color:#2a1e00;font-size:15px;box-shadow:0 0 14px rgba(245,197,66,.5);}
  .csub{color:#b39a63;font-size:12px;margin:6px 0 16px;}
  .fld{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .fld label{color:#d9c489;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;}
  .fld input{background:#0a0906;border:1px solid #3a2f14;border-radius:11px;padding:11px 13px;color:#fff;font-size:14px;outline:none;transition:.15s;}
  .fld input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.15);}

  .toggle{display:flex;align-items:center;gap:9px;background:#0d1930;border:1px solid #24406e;border-radius:11px;padding:10px 12px;margin-bottom:14px;}
  .toggle input{width:18px;height:18px;}
  .toggle label{font-size:13px;color:#cfe0f8;font-weight:700;}

  .adjust{border:1px solid #3a2f14;border-radius:12px;padding:12px;margin-bottom:14px;}
  .adjust .at{color:#7fd4ff;font-size:12px;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
  .sel{width:100%;background:#0a0906;border:1px solid #3a2f14;border-radius:9px;padding:8px 10px;color:#fff;font-size:13px;margin-bottom:10px;}
  .slider{margin-bottom:9px;}
  .slider label{font-size:11px;color:#c9b177;display:flex;justify-content:space-between;margin-bottom:3px;}
  .slider input[type=range]{width:100%;}

  .upload{display:block;border:2px dashed #5a4718;border-radius:14px;padding:18px 14px;text-align:center;
    color:#c9b177;cursor:pointer;transition:.15s;background:#0b0a06;margin-bottom:12px;}
  .upload:hover{border-color:var(--gold);color:#fff;background:#12100a;}
  .upload .u1{font-size:24px;margin-bottom:5px;}
  .upload .u2{font-size:13px;font-weight:800;}
  .upload .u3{font-size:11px;color:#9b8250;margin-top:4px;line-height:1.5;}
  .upload input{display:none;}
  .upload.has{border-color:#4ade80;color:#bff0cf;background:#0c2417;}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,#ffe9a8,#b8891f);color:#2a1e00;box-shadow:0 8px 20px rgba(245,197,66,.3);transition:.15s;margin-bottom:8px;}
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn2{background:#2a2419;color:#e8d9a8;box-shadow:none;border:1px solid #4a3d1c;}
  .cnote{font-size:11px;color:#9b8250;line-height:1.6;margin-top:12px;border-top:1px solid #3a2f14;padding-top:12px;}

  .poster-wrap{display:flex;justify-content:center;}
  .poster{position:relative;width:900px;max-width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.7);}
  .poster .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;}

  /* PHONE FRAME wrapping receipt */
  /* realistic dark phone body — thin gunmetal bezel, no yellow */
  .phone{position:absolute;z-index:2;transform:translate(-50%,-50%);touch-action:none;
    padding:1.4%;
    background:linear-gradient(155deg,#4a4a50 0%, #232327 22%, #101012 55%, #26262b 82%, #3a3a40 100%);
    box-shadow:0 24px 50px rgba(0,0,0,.8),
      inset 0 0 0 1px rgba(255,255,255,.14),
      inset 0 0 16px rgba(0,0,0,.9);}
  .phone .screen{position:absolute;inset:2.4%;border-radius:calc(min(2vw,26px));overflow:hidden;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2px #050505;}
  .phone .screen img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;}
  /* pill camera notch inside the screen */
  .phone .notch{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);
    width:24%;height:2.6%;min-height:11px;background:#0a0a0a;border-radius:99px;z-index:5;
    display:flex;align-items:center;justify-content:center;gap:10%;}
  .phone .notch::before{content:"";width:28%;height:22%;min-height:3px;background:#2a2a2a;border-radius:4px;}
  .phone .notch::after{content:"";width:6px;height:6px;background:#16324a;border-radius:50%;
    box-shadow:0 0 0 1.5px #0a0a0a;}
  .phone .ph{color:#999;font-size:min(1.5vw,13px);text-align:center;padding:14px;line-height:1.6;background:#f3f3f3;
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;}

  .shield{position:absolute;z-index:4;transform:translate(-50%,-50%);touch-action:none;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));-webkit-user-drag:none;}
  .shield img{display:block;width:100%;height:auto;-webkit-user-drag:none;}

  .ov{position:absolute;z-index:3;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;touch-action:none;}
  #oWinner{color:var(--gold);font-weight:900;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  #oGame{color:#fff;}

  .editable{cursor:move;}
  .selbox{outline:2px dashed #ff3b6b;outline-offset:2px;}
  .selbox.green{outline-color:#22c55e;}
  .handle{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:4px;
    background:#22c55e;border:2px solid #fff;cursor:nwse-resize;z-index:9;display:none;}
  .showhandle > .handle{display:block;}

  @media(max-width:1040px){.control{position:static;}}
</style>
</head>
<body>
  <div class="app">
    <aside class="control">
      <div class="ctitle"><span class="dot">&#9881;&#65039;</span> Edit Dashboard</div>
      <div class="csub">Semua ukuran &amp; posisi tersimpan otomatis (buka lagi tetap pas).</div>

      <div class="fld"><label>&#127942; Total Winner (Rp)</label><input id="iWinner" value="51.000.000"></div>
      <div class="fld"><label>&#127920; JP Pada Permainan</label><input id="iGame" value="Starlight Princess Super Scatter"></div>

      <div class="toggle">
        <input type="checkbox" id="editMode">
        <label for="editMode">&#128207; Mode Atur Posisi</label>
      </div>

      <div class="adjust">
        <div class="at">Atur Elemen Terpilih</div>
        <select class="sel" id="pick">
          <option value="phone">HP + Struk</option>
          <option value="winner">Total Winner</option>
          <option value="game">JP Permainan</option>
        </select>
        <div class="slider"><label>Kiri &#8596; Kanan <span id="vX">50%</span></label><input type="range" id="rX" min="0" max="100" step="0.1"></div>
        <div class="slider"><label>Atas &#8597; Bawah <span id="vY">50%</span></label><input type="range" id="rY" min="0" max="100" step="0.1"></div>
        <div class="slider" id="sizeWrap"><label>Ukuran <span id="vS">100%</span></label><input type="range" id="rS" min="10" max="100" step="0.5"></div>
      </div>

      <label class="upload" id="uploadBox" for="iFile">
        <div class="u1">&#128228;</div>
        <div class="u2" id="uText">Upload Bukti Transfer</div>
        <div class="u3">Struk masuk ke dalam frame HP.</div>
        <input type="file" id="iFile" accept="image/*">
      </label>

      <button class="btn" onclick="downloadImg()">&#11015;&#65039; Download Gambar</button>
      <button class="btn btn2" onclick="resetPos()">&#8635; Reset Posisi ke Default</button>
      <div class="cnote">&#128161; Aktifkan Mode Atur, seret elemen atau pakai slider. Ukuran &amp; struk tersimpan otomatis di browser.</div>
    </aside>

        <div class="phone" id="phone">
          <div class="notch"></div>
          <div class="screen" id="screen"><div class="ph">Upload bukti<br>transfer</div></div>
          <div class="handle" data-h="phone"></div>
        </div>

        <div class="ov" id="oWinner">Rp 51.000.000</div>
        <div class="ov" id="oGame">Starlight Princess Super Scatter</div>
</div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const $=id=>document.getElementById(id);
  const poster=$('poster'), editChk=$('editMode');
  const KEY='hokben_pos_v4', IMGKEY='hokben_img_v3';

  const DEFAULT = {
    phone: {x:72, y:52, w:34, h:70, type:'phone'},
    winner:{x:37, y:52.6, s:26, type:'text'},
    game:  {x:44, y:61,   s:21, type:'text'}
  };
  let st = load();
  const elOf = {phone:$('phone'), winner:$('oWinner'), game:$('oGame')};

  function load(){
    try{
      const s=JSON.parse(localStorage.getItem(KEY));
      if(s){
        const clean={};
        for(const k in DEFAULT){ clean[k] = s[k] ? s[k] : JSON.parse(JSON.stringify(DEFAULT[k])); }
        return clean; // only known keys -> no undefined elOf access
      }
    }catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT));
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

  function pw(){ return poster.getBoundingClientRect().width; }
  function applyOne(k){
    const s=st[k], el=elOf[k];
    if(s.type==='text'){
      el.style.left=s.x+'%'; el.style.top=s.y+'%'; el.style.fontSize=(s.s*(pw()/900))+'px';
    }else if(s.type==='phone'){
      el.style.left=s.x+'%'; el.style.top=s.y+'%';
      el.style.width=s.w+'%'; el.style.height=s.h+'%';
      el.style.borderRadius=(s.w*pw()/100*0.11)+'px';
    }else{ // img
      el.style.left=s.x+'%'; el.style.top=s.y+'%'; el.style.width=s.w+'%';
    }
  }
  function applyAll(){ for(const k in st) applyOne(k); }

  $('iWinner').addEventListener('input',e=>{$('oWinner').textContent='Rp '+e.target.value;});
  $('iGame').addEventListener('input',e=>{$('oGame').textContent=e.target.value;});

  const pick=$('pick'), rX=$('rX'), rY=$('rY'), rS=$('rS');
  function loadPick(){
    const k=pick.value, s=st[k];
    rX.value=s.x; rY.value=s.y; $('vX').textContent=s.x.toFixed(1)+'%'; $('vY').textContent=s.y.toFixed(1)+'%';
    if(s.type==='text'){ rS.min=10;rS.max=60;rS.value=s.s; $('vS').textContent=s.s.toFixed(0)+'px'; }
    else if(s.type==='phone'){ rS.min=20;rS.max=60;rS.value=s.w; $('vS').textContent=s.w.toFixed(0)+'%'; }
    else { rS.min=8;rS.max=40;rS.value=s.w; $('vS').textContent=s.w.toFixed(0)+'%'; }
    highlight();
  }
  pick.addEventListener('change',loadPick);
  rX.addEventListener('input',()=>{st[pick.value].x=parseFloat(rX.value);$('vX').textContent=st[pick.value].x.toFixed(1)+'%';applyOne(pick.value);save();});
  rY.addEventListener('input',()=>{st[pick.value].y=parseFloat(rY.value);$('vY').textContent=st[pick.value].y.toFixed(1)+'%';applyOne(pick.value);save();});
  rS.addEventListener('input',()=>{
    const k=pick.value,s=st[k];
    if(s.type==='text'){s.s=parseFloat(rS.value);$('vS').textContent=s.s.toFixed(0)+'px';}
    else if(s.type==='phone'){const r=s.h/s.w;s.w=parseFloat(rS.value);s.h=s.w*r;$('vS').textContent=s.w.toFixed(0)+'%';}
    else {s.w=parseFloat(rS.value);$('vS').textContent=s.w.toFixed(0)+'%';}
    applyOne(k);save();
  });

  editChk.addEventListener('change',()=>{
    for(const k in st) elOf[k].classList.toggle('editable',editChk.checked);
    highlight();
  });
  function highlight(){
    const on=editChk.checked, sel=pick.value;
    for(const k in st){
      const el=elOf[k];
      el.classList.toggle('selbox', on && k===sel);
      el.classList.toggle('green', (k==='phone'));
      el.classList.toggle('showhandle', on && k===sel && (st[k].type==='phone'||st[k].type==='img'));
    }
  }

  let mode=null, cur=null, orig=null, startX=0, startY=0, rect=null;
  function ptr(e){ return e.touches? {x:e.touches[0].clientX,y:e.touches[0].clientY} : {x:e.clientX,y:e.clientY}; }
  function startDrag(k,e){ if(!editChk.checked)return; e.preventDefault();e.stopPropagation();
    pick.value=k;loadPick();mode='move';cur=k;rect=poster.getBoundingClientRect();const p=ptr(e);startX=p.x;startY=p.y;orig={...st[k]}; }
  function startResize(k,e){ if(!editChk.checked)return; e.preventDefault();e.stopPropagation();
    pick.value=k;loadPick();mode='resize';cur=k;rect=poster.getBoundingClientRect();const p=ptr(e);startX=p.x;startY=p.y;orig={...st[k]}; }
  function onMove(e){
    if(!mode)return;
    const p=ptr(e), dx=(p.x-startX)/rect.width*100, dy=(p.y-startY)/rect.height*100, s=st[cur];
    if(mode==='move'){
      s.x=Math.max(0,Math.min(100,orig.x+dx)); s.y=Math.max(0,Math.min(100,orig.y+dy));
      rX.value=s.x;rY.value=s.y;$('vX').textContent=s.x.toFixed(1)+'%';$('vY').textContent=s.y.toFixed(1)+'%';
    }else{
      if(s.type==='phone'){const r=orig.h/orig.w; s.w=Math.max(15,orig.w+dx); s.h=s.w*r;}
      else if(s.type==='img'){ s.w=Math.max(6,orig.w+dx); }
      rS.value=s.w;$('vS').textContent=s.w.toFixed(0)+'%';
    }
    applyOne(cur);
  }
  function endMove(){ if(mode){mode=null;save();} }

  for(const k in st){
    elOf[k].addEventListener('mousedown',e=>startDrag(k,e));
    elOf[k].addEventListener('touchstart',e=>startDrag(k,e),{passive:false});
  }
  function bindHandles(){
    document.querySelectorAll('.handle').forEach(h=>{
      const k=h.dataset.h;
      h.onmousedown=e=>startResize(k,e);
      h.ontouchstart=e=>startResize(k,e);
    });
  }
  bindHandles();
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',endMove);
  window.addEventListener('touchend',endMove);
  window.addEventListener('resize',applyAll);

  $('iFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{ setReceipt(ev.target.result,f.name); try{localStorage.setItem(IMGKEY,ev.target.result);}catch(_){} };
    r.readAsDataURL(f);
  });
  function setReceipt(src,name){
    $('screen').innerHTML='<img alt="bukti">';
    $('screen').querySelector('img').src=src;
    $('uploadBox').classList.add('has');
    $('uText').textContent='\u2714 '+(name&&name.length>18?name.slice(0,18)+'\u2026':(name||'Tersimpan'));
  }

  function resetPos(){ st=JSON.parse(JSON.stringify(DEFAULT)); save(); applyAll(); loadPick(); }

  function downloadImg(){
    const was=editChk.checked; editChk.checked=false;
    for(const k in st) elOf[k].classList.remove('editable','selbox','showhandle');
    html2canvas(poster,{scale:2,useCORS:true,allowTaint:false,backgroundColor:null}).then(c=>{
      const a=document.createElement('a');a.download='bukti-kemenangan.png';a.href=c.toDataURL('image/png');a.click();
      editChk.checked=was; if(was){for(const k in st)elOf[k].classList.add('editable');highlight();}
    }).catch(err=>{alert('Gagal download: '+err.message);editChk.checked=was;});
  }

  (function(){ try{ const im=localStorage.getItem(IMGKEY); if(im) setReceipt(im,'Tersimpan'); }catch(_){} })();
  applyAll(); loadPick();
</script>
</body>
</html>
