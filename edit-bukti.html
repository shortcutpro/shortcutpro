<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Simulasi Transfer</title>
  <style>
    * {
      box-sizing:border-box
    }
    html {
      min-height:100%;
      background:#edf1f7
    }
    body {
      margin:0;
      color:#192b45;
      font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(ellipse at 12% 0%,#e0e9f6 0,transparent 50%),#edf1f7
    }
    .top {
      position:sticky;
      top:0;
      z-index:2;
      background:#101c31;
      border-bottom:1px solid #2a3951;
      padding:17px max(24px,calc((100% - 1120px)/2));
      box-shadow:0 6px 24px #14243a22
    }
    .heading {
      display:flex;
      align-items:center;
      justify-content:space-between
    }
    .heading p {
      margin:0;
      color:#bac8db;
      font-size:12px;
      letter-spacing:.2px
    }
    .heading p:before {
      content:"";
      display:inline-block;
      width:7px;
      height:7px;
      background:#dcb67b;
      border-radius:50%;
      margin-right:8px;
      vertical-align:1px
    }
    .tabs {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
      margin-top:13px;
      padding:5px;
      background:#1b2940;
      border:1px solid #30405a;
      border-radius:14px
    }
    .tabs button {
      font:inherit;
      font-weight:700;
      letter-spacing:.15px;
      background:transparent;
      border:1px solid transparent;
      border-radius:9px;
      min-height:44px;
      padding:10px 14px;
      color:#c1cede;
      cursor:pointer;
      transition:background .15s,color .15s
    }
    .tabs button:hover {
      background:#2c3c55;
      color:white
    }
    .tabs button[aria-selected=true] {
      background:#fff;
      color:#15243b;
      box-shadow:0 3px 9px #0003
    }
    .tabs button:focus-visible {
      outline:2px solid #dcb67b;
      outline-offset:2px
    }
    iframe {
      width:100%;
      border:0;
      display:block;
      min-height:300px
    }
    iframe[hidden] {
      display:none
    }
    @media(max-width:600px) {
      .top {
        position:static;
        padding:14px 12px
      }
      .tabs {
        gap:3px
      }
      .tabs button {
        padding:9px 4px;
        font-size:13px;
        min-height:40px
      }
    }
  </style>
</head>

      "(() => {\n" +
      "  const dateInput = document.getElementById('date');\n" +
      "  const timeInput = document.getElementById('time');\n" +
      "  const clock = new Intl.DateTimeFormat('en-GB', {\n" +
      "    timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit',\n" +
      "    day: '2-digit', hour: '2-digit', minute: '2-digit',\n" +
      "    second: '2-digit', hourCycle: 'h23'\n" +
      "  });\n" +
      "  function syncClock() {\n" +
      "    const p = Object.fromEntries(clock.formatToParts(new Date()).map(x => [x.type, x.value]));\n" +
      "    const date = `${p.year}-${p.month}-${p.day}`;\n" +
      "    const time = `${p.hour}:${p.minute}:${p.second}`;\n" +
      "    // Time inputs may normalize a zero-second value to HH:mm.\n" +
      "    const previousTime = timeInput.value.length === 5 ? timeInput.value + ':00' : timeInput.value;\n" +
      "    if (dateInput.value !== date || previousTime !== time) {\n" +
      "      dateInput.value = date;\n" +
      "      timeInput.value = time;\n" +
      "      draw();\n" +
      "    }\n" +
      "  }\n" +
      "  let accessDate, accessTime;\n" +
      "  function onAccess() {\n" +
      "    syncClock();\n" +
      "    accessDate = dateInput.value;\n" +
      "    accessTime = timeInput.value;\n" +
      "  }\n" +
      "  onAccess();\n" +
      "  window.addEventListener('simulationclockrefresh', onAccess);\n" +
      "  document.getElementById('reset').addEventListener('click', () => {\n" +
      "    dateInput.value = accessDate;\n" +
      "    timeInput.value = accessTime;\n" +
      "    dateInput.dispatchEvent(new Event('input', {bubbles:true}));\n" +
      "  });\n" +
      "})();\n" +
      "\u003c/script>\n" +

      "    }\n" +
      "  }\n" +

      "  });\n" +
      "})();\n" +

      "const $=id=>document.getElementById(id);const rupiah=n=>'Rp'+new Intl.NumberFormat('id-ID').format(n);const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];function safe(id){return Math.min(999999999999,Math.max(0,Math.trunc(Number($(id).value)||0)))}function render(){const n=safe('nominal'),f=safe('biaya');$('amount').textContent=$('nomout').textContent=rupiah(n);$('feeout').textContent=rupiah(f);$('totalout').textContent=rupiah(n+f);const d=$('tanggal').value.split('-'),t=$('jam').value||'00:00:00';$('dateout').textContent=(d.length===3?Number(d[2])+' '+months[Number(d[1])-1]+' '+d[0]:'\u2014')+' \u00b7 '+(t.length===5?t+':00':t)+' WIB'}['nominal','tanggal','jam','biaya'].forEach(id=>$(id).addEventListener('input',render));$('reset').addEventListener('click',()=>{$('nominal').value=500000;$('tanggal').value='2026-08-18';$('jam').value='21:33:29';$('biaya').value=0;render()});render();\u003c/script>\u003cscript>\n" +
      "(()=>{\n" +
      "const target=document.querySelector('.receipt');\n" +
      "const btn=document.createElement('button');btn.type='button';btn.textContent='Unduh PNG';btn.id='downloadPNG';document.querySelector('.panel').append(btn);\n" +
      "const status=document.createElement('div');status.style.cssText='font-size:12px;margin-top:10px;color:#475569';status.setAttribute('role','status');btn.after(status);\n" +
      "btn.onclick=async()=>{\n" +
      "btn.disabled=true;status.textContent='Menyiapkan PNG\u2026';\n" +
      "try{\n" +
      "await document.fonts.ready;await Promise.all([...target.querySelectorAll('img')].map(im=>im.decode()));\n" +
      "const r=target.getBoundingClientRect(), w=Math.ceil(r.width),h=Math.ceil(r.height),scale=2;\n" +
      "const clone=target.cloneNode(true);const src=[target,...target.querySelectorAll('*')], dst=[clone,...clone.querySelectorAll('*')];\n" +
      "for(let i=0;i\u003csrc.length;i++){\n" +
      " const cs=getComputedStyle(src[i]);for(let j=0;j\u003ccs.length;j++){const p=cs[j];dst[i].style.setProperty(p,cs.getPropertyValue(p));}\n" +
      "}\n" +
      "clone.style.setProperty('margin','0');clone.style.setProperty('width',w+'px');clone.style.setProperty('height',h+'px');clone.style.setProperty('box-shadow','none');clone.style.setProperty('transform','none');\n" +
      "const wrap=document.createElementNS('http://www.w3.org/1999/xhtml','div');wrap.style.cssText='margin:0;padding:0;width:'+w+'px;height:'+h+'px;overflow:hidden;background:white';wrap.append(clone);\n" +
      "const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);\n" +
      "const foreign=document.createElementNS(svg.namespaceURI,'foreignObject');foreign.setAttribute('width','100%');foreign.setAttribute('height','100%');foreign.append(wrap);svg.append(foreign);\n" +
      "const data='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));\n" +
      "const im=new Image();im.src=data;await im.decode();const canvas=document.createElement('canvas');canvas.width=w*scale;canvas.height=h*scale;const c=canvas.getContext('2d');c.scale(scale,scale);c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(im,0,0,w,h);\n" +
      "const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG kosong');const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='simulasi-wondr.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);status.textContent='PNG simulasi siap diunduh.';\n" +
      "}catch(e){status.textContent='Gagal membuat PNG: '+e.message;console.error(e)}finally{btn.disabled=false}\n" +
      "};})();\n" +
      "\u003c/script>\u003cscript>\n" +
      "(() => {\n" +
      "  const dateInput = document.getElementById('tanggal');\n" +
      "  const timeInput = document.getElementById('jam');\n" +
      "  const clock = new Intl.DateTimeFormat('en-GB', {\n" +
      "    timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit',\n" +
      "    day: '2-digit', hour: '2-digit', minute: '2-digit',\n" +
      "    second: '2-digit', hourCycle: 'h23'\n" +
      "  });\n" +
      "  function syncClock() {\n" +
      "    const p = Object.fromEntries(clock.formatToParts(new Date()).map(x => [x.type, x.value]));\n" +
      "    const date = `${p.year}-${p.month}-${p.day}`;\n" +
      "    const time = `${p.hour}:${p.minute}:${p.second}`;\n" +
      "    // Time inputs may normalize a zero-second value to HH:mm.\n" +
      "    const previousTime = timeInput.value.length === 5 ? timeInput.value + ':00' : timeInput.value;\n" +
      "    if (dateInput.value !== date || previousTime !== time) {\n" +
      "      dateInput.value = date;\n" +
      "      timeInput.value = time;\n" +
      "      render();\n" +
      "    }\n" +
      "  }\n" +
      "  let accessDate, accessTime;\n" +
      "  function onAccess() {\n" +
      "    syncClock();\n" +
      "    accessDate = dateInput.value;\n" +
      "    accessTime = timeInput.value;\n" +
      "  }\n" +
      "  onAccess();\n" +
      "  window.addEventListener('simulationclockrefresh', onAccess);\n" +
      "  document.getElementById('reset').addEventListener('click', () => {\n" +
      "    dateInput.value = accessDate;\n" +
      "    timeInput.value = accessTime;\n" +
      "    dateInput.dispatchEvent(new Event('input', {bubbles:true}));\n" +
      "  });\n" +
      "})();\n" +
      "\u003c/script>\n" +
      "\u003cscript>\n" +
      "(()=>{\n" +
      " const main=document.querySelector('main'), panel=main.querySelector('.panel');\n" +
      " const oldPreview=main.querySelector('.preview, .receipt');\n" +
      " const canvas=oldPreview.querySelector('canvas');\n" +
      " main.classList.add('studio-layout');\n" +
      " const head=document.createElement('div');head.innerHTML='\u003cdiv class=\"studio-kicker\">Studio simulasi\u003c/div>\u003ch2 class=\"studio-title\">Pengaturan\u003c/h2>\u003cp class=\"studio-sub\">Edit data latihan untuk pratinjau.\u003c/p>';\n" +
      " const fields=document.createElement('div');fields.className='studio-fields';\n" +
      " for(const label of [...panel.querySelectorAll('label')]){const input=document.getElementById(label.htmlFor);if(!input)continue;fields.append(label,input.closest('.money')||input);}\n" +
      " const controls=document.createElement('div');controls.className='studio-controls';const buttons=[...panel.querySelectorAll('button')];const download=buttons.find(b=>b.id!=='reset');const reset=buttons.find(b=>b.id==='reset');if(download)controls.append(download);if(reset)controls.append(reset);\n" +
      " const notes=document.createElement('div');notes.className='studio-notes';for(const node of [...panel.querySelectorAll('.notice,.hint,.note,.foot,[role=\"status\"],p:not(.sub):not(.help)')]){if(!notes.contains(node))notes.append(node);}\n" +
      " panel.replaceChildren(head,fields,controls,notes);\n" +
      " const preview=document.createElement('div');preview.className='studio-preview';preview.innerHTML='\u003cdiv class=\"studio-preview-head\">\u003cdiv>\u003cstrong>Pratinjau simulasi\u003c/strong>\u003csmall>Data fiktif \u00b7 bukan bukti pembayaran\u003c/small>\u003c/div>\u003cspan class=\"studio-format\">PNG\u003c/span>\u003c/div>\u003cdiv class=\"studio-stage\">\u003c/div>';\n" +
      " const stage=preview.querySelector('.studio-stage');if(canvas){oldPreview.replaceWith(preview);stage.append(canvas);}else{oldPreview.replaceWith(preview);stage.append(oldPreview);}\n" +
      "})();\n" +
      "\u003c/script>\u003c/body>\u003c/html>"
  };

  const frames = {};
  const buttons = [...document.querySelectorAll('[role=tab]')];

  function fit(frame) {
    if (frame.hidden) return;
    const doc = frame.contentDocument;
    if (!doc || !doc.body) return;
    const main = doc.querySelector('main');
    const b = doc.body;
    const end = Math.max(b.getBoundingClientRect().bottom, main ? main.getBoundingClientRect().bottom + 35 : 0);
    const h = Math.ceil(end + Math.max(0, -b.getBoundingClientRect().top));
    if (h > 0) frame.style.height = Math.max(300, h) + 'px';
  }

  function select(name) {
    if (buttons.some(b => b.dataset.name === name && b.getAttribute('aria-selected') === 'true')) return;
    for (const b of buttons) b.setAttribute('aria-selected', String(b.dataset.name === name));
    for (const [key, f] of Object.entries(frames)) f.hidden = key !== name;
    if (!frames[name]) {
      const f = document.createElement('iframe');
      f.title = 'Editor simulasi ' + name;
      f.srcdoc = docs[name];
      f.addEventListener('load', () => {
        fit(f);
        if (f.contentDocument?.body) {
          const ro = new ResizeObserver(() => fit(f));
          ro.observe(f.contentDocument.body);
        }
      });
      frames[name] = f;
      document.getElementById('frames').append(f);
    } else {
      frames[name].contentWindow.dispatchEvent(new Event('simulationclockrefresh'));
      requestAnimationFrame(() => fit(frames[name]));
    }
  }

  for (const b of buttons) b.addEventListener('click', () => select(b.dataset.name));
  window.addEventListener('resize', () => Object.values(frames).forEach(fit));
  select('BCA');
